name: Build Sam-Ann Solar APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'SamAnnSolarAndroid.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project ZIP
        run: unzip -q SamAnnSolarAndroid.zip -d source
      - name: Check Android project files
        run: ls -la source/samann-app/android-app && ls -la source/samann-app/android-app/app
      - name: Build debug APK
        working-directory: source/samann-app/android-app
        run: gradle --no-daemon assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sam-Ann-Solar-APK
          path: source/samann-app/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
